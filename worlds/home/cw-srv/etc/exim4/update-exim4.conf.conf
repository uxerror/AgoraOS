# /etc/exim4/update-exim4.conf.conf: Cablewave's mail server.
# Mail for cablewave.net goes to the customers' mailboxes; it relays for
# the cable customers (192.0.2.0/24) only.
dc_eximconfig_configtype='internet'
dc_other_hostnames='cablewave.net'
dc_local_interfaces=''
dc_readhost=''
dc_relay_domains=''
dc_minimaldns='false'
dc_relay_nets='192.0.2.0/24'
dc_smarthost=''
CFILEMODE='644'
dc_use_split_config='false'
dc_hide_mailname=''
dc_mailname_in_oh='true'
dc_localdelivery='mail_spool'
