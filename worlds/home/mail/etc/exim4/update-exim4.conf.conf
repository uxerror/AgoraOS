# /etc/exim4/update-exim4.conf.conf: LanLink's mail server.
# It takes mail for lanlink.net, delivers to the members' mailboxes, and
# relays for LanLink's DSL customers (203.0.113.0/24) only.
dc_eximconfig_configtype='internet'
dc_other_hostnames='lanlink.net'
dc_local_interfaces=''
dc_readhost=''
dc_relay_domains=''
dc_minimaldns='false'
dc_relay_nets='203.0.113.0/24'
dc_smarthost=''
CFILEMODE='644'
dc_use_split_config='false'
dc_hide_mailname=''
dc_mailname_in_oh='true'
dc_localdelivery='mail_spool'
