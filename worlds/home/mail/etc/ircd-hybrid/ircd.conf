/* /etc/ircd-hybrid/ircd.conf: IRCD-Hybrid configuration. */

serverinfo {
	name = "irc.lanlink.net";
	description = "LanLink Internet IRC";
	network_name = "LanLinkNet";
	network_desc = "LanLink Internet chat";
	hub = no;
};

admin {
	name = "LanLink IRC staff";
	description = "Main Server Administrator";
	email = "<irc@lanlink.net>";
};

listen {
	port = 6667;
};

auth {
	user = "*@*";
	class = "users";
};
