# The LanLink help desk bot.
server localhost 6667
nick LanHelp
user lanhelp
name LanLink help desk
channel #lanlink
topic #lanlink LanLink Internet help | Support: http://www.lanlink.net/support.html | Ask, then wait
greet Hello $nick, welcome to $channel. Ask your question and someone will answer.
on !help I know: !mail !dsl !dns !time
on !mail POP3 and SMTP are mail.lanlink.net. Your address is login@lanlink.net.
on !dsl DSL light blinking? Check the cable to the wall, then power the modem off and on.
on !dns Name servers: 198.51.100.1. Put it in /etc/resolv.conf as "nameserver 198.51.100.1".
on !time It is $time.
hear password Never tell anyone your password, $nick. Staff will never ask for it.
hear modem Is the DSL light on your modem steady, $nick? See !dsl.
