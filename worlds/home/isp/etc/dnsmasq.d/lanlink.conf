# /etc/dnsmasq.d/lanlink.conf: the provider's name server.
# Our names live in /etc/hosts. Cablewave's domains, and the reverse
# zones of its networks, are asked of its name server across the exchange.
no-resolv
domain-needed
cache-size=500
# Mail for lanlink.net goes to the mail server.
mx-host=lanlink.net,mail.lanlink.net,10
# Cablewave's names.
server=/cablewave.net/198.18.0.2
server=/fragzone.org/198.18.0.2
server=/1.18.198.in-addr.arpa/198.18.0.2
server=/2.0.192.in-addr.arpa/198.18.0.2
