<h2>The Ferret crawler</h2>
<p>Our crawler identifies itself as <tt>Ferret/0.9</tt>. It reads
<tt>/robots.txt</tt> on every site and stays out of the directories listed
under <tt>User-agent: *</tt> or <tt>User-agent: Ferret</tt>, like this:</p>
<pre>
User-agent: *
Disallow: /private/
</pre>
