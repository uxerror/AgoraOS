<h2>About Ferret</h2>
<p>Ferret started in 2002 as a weekend project of two students who were
tired of search engines that put ads above the results. It runs on one
server in a closet, crawls the web every half hour and ranks pages by the
words in them, with words in the title counting most.</p>
