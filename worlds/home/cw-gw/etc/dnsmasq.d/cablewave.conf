# /etc/dnsmasq.d/cablewave.conf: Cablewave's name server.
# Our names live in /etc/hosts; LanLink's, and the rest of the net they
# carry, are asked of LanLink's name server across the exchange.
no-resolv
domain-needed
cache-size=500
mx-host=cablewave.net,mail.cablewave.net,10
server=/lanlink.net/198.18.0.1
server=/penguinpit.org/198.18.0.1
server=/byteslash.org/198.18.0.1
server=/staticnoise.org/198.18.0.1
server=/demozone.net/198.18.0.1
server=/ferret.org/198.18.0.1
server=/pingmsg.com/198.18.0.1
server=/agoraos.org/198.18.0.1
server=/100.51.198.in-addr.arpa/198.18.0.1
server=/113.0.203.in-addr.arpa/198.18.0.1
